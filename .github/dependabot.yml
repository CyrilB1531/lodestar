version: 2

# Actions are pinned to full commit SHAs so a moved tag cannot change what runs
# in CI. That only stays safe if the pins are actually maintained — Dependabot
# understands SHA pins and refreshes both the SHA and its version comment.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # One PR for routine bumps rather than one per action — but minor and patch
      # only. Majors are the updates that can change behaviour, so they arrive
      # individually and can be judged on their own merits. Grouping them means a
      # six-action block that can only be taken or refused whole, and two of the
      # four workflows are tag/dispatch-triggered, so no pull request exercises
      # them: an unreviewed major there surfaces at publish time.
      actions:
        patterns: ['*']
        update-types: [minor, patch]

  # Nine of thirteen pins were behind when #622 measured them, and the reason was structural:
  # this file declared one ecosystem. Every dependency pull request in the repository's
  # history is an Actions bump, because Actions were the only thing anything watched.
  - package-ecosystem: nuget
    directories:
      - /src
      - /tests
      - /bench
      - /samples
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      # Same split as the actions group above, for the same reason: a minor or patch bump is
      # routine and reviewing six of them separately buys nothing, while a major can change
      # behaviour and deserves its own merits. `xunit.runner.visualstudio` going 2.8.2 to
      # 4.0.0 is the case in point -- it crossed two majors and still runs v1, v2 and v3.
      nuget:
        patterns: ['*']
        update-types: [minor, patch]

  # tools/requirements.txt is the human-edited input and requirements.lock.txt the hashed
  # compile of it. Dependabot edits both -- measured on #636, #637 and #640, which each
  # changed the two files -- but it does not *compile* the second: it rewrites the pin and
  # its hashes in place, so the lock stops being a resolution and becomes an assertion.
  # #639 is what that costs. It raised pandas to 3.0.5 in the lock alone, where pandas is
  # transitive, and lifelines 0.30.3 declares `pandas<3.0,>=2.1` -- a pin the resolver would
  # never have produced.
  #
  # A pull request here is therefore a notification and not a merge, and the header of
  # tools/requirements.txt says why it cannot be one: the corpora under tests/oracles/ ARE
  # these libraries' output, and nothing generates them but tools/generate_oracles.py.
  # Watched anyway -- #622 found nine of thirteen pins behind precisely because nothing
  # watched, and a red pull request naming a new version is still how the news arrives.
  # #643 is the shape the bump then takes by hand.
  - package-ecosystem: pip
    directory: /tools
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      pip:
        patterns: ['*']
        update-types: [minor, patch]
    # Two that are not bumps at all, so they are refused once here rather than every month.
    ignore:
      # 0.5.0 publishes an sdist and no wheel, and all five install sites in this repository
      # pass --only-binary :all:. #636 offered it and failed on every job with
      # "Could not find a version that satisfies the requirement autograd-gamma==0.5.0".
      # tools/requirements.txt pins 0.4.2 with that reason written above it.
      - dependency-name: autograd-gamma
      # Transitive, through statsmodels and lifelines, and capped by the latter at <3.0.
      # Dependabot reached past the resolver into its output (#639). A recompile from an
      # unchanged requirements.txt keeps 2.3.3, which is also what ADR 0099 recorded.
      - dependency-name: pandas
