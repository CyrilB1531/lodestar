name: Wiki

# The pages live in docs/, where markdownlint, the snippet compiler and review
# reach them; this is what turns them into what a reader sees. A push to main
# refreshes each package's live channel, and a per-package tag freezes an
# archive directory. See docs/superpowers/specs/2026-08-15_0181_documentation-per-version-and-per-function.md.

# One `push` trigger carries both: a `paths` filter narrows branch pushes only, so
# the tag trigger is not silently filtered by it.

# Only what build_wiki.py reads belongs below. CONTRIBUTING.md was listed and is not
# published by docs/wiki-map.json, so every edit to it started a run that wrote nothing (#257).
on:
  push:
    branches: [main]
    tags: ['Lodestar.*/v*']
    paths:
      - 'docs/**'
      - 'tools/build_wiki.py'
      - 'tools/build_site.py'
      - 'tools/site/**'
      - '.config/dotnet-tools.json'
      - 'src/*/README.md'
      - 'src/*/performance.md'
      - 'assets/icon.png'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:
    inputs:
      archive:
        description: 'PACKAGE=VERSION to archive, e.g. Lodestar.Text=0.3.1. Empty refreshes the live channels.'
        required: false
        default: ''

# Nothing by default: each job names what it writes (S8233).
permissions: {}

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes to the wiki repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the released versions are read from the tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The tag is <PackageId>/v<Version>, so the latest release of each package is
      # the highest such tag. Read from git rather than from Version.props, which
      # declares the NEXT version and would name something nobody can install.
      #
      # The packages come from docs/wiki-map.json rather than a list here: it already
      # says which pages ship with which package, and a hard-coded copy went eight
      # packages stale while sixteen shipped. A package with no tag yet is skipped.
      - name: The released version of each package
        id: released
        run: |
          set -euo pipefail
          args=""
          for package in $(python -c "import json; print(' '.join(sorted(json.load(open('docs/wiki-map.json'))['packages'])))"); do
            version=$(git tag --list "$package/v*" | sed "s|$package/v||" | sort -V | tail -1)
            if [ -n "$version" ]; then
              args="$args --released $package=$version"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      # A ref name is untrusted input, so it stays in the environment and is never
      # interpolated into the script — the same rule release.yml follows.
      - name: What to publish
        id: what
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_ARCHIVE: ${{ github.event.inputs.archive }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            echo "archive=--archive ${REF_NAME%/v*}=${REF_NAME##*/v}" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_ARCHIVE" ]; then
            echo "archive=--archive $INPUT_ARCHIVE" >> "$GITHUB_OUTPUT"
          else
            echo "archive=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Build the tree
        run: |
          python tools/build_wiki.py --repo . --out wiki \
            ${{ steps.released.outputs.args }} ${{ steps.what.outputs.archive }}

      # A tag push archives the version that triggered it, and GitHub keeps at most one
      # pending run per concurrency group -- so publishing several tags together drops
      # every archive but the last, in silence (#199). Any run catches the others up,
      # which makes a cancelled run cost nothing.
      #
      # Each missing archive is built from its own tag through a worktree, never from
      # the tree this run checked out: the documentation moves between releases, and
      # freezing today's pages under an older number would be worse than the gap.
      - name: Archive the releases the wiki does not hold
        run: |
          set -euo pipefail
          python tools/build_wiki.py --repo . --out wiki \
            ${{ steps.released.outputs.args }} --report-missing-archives > missing.txt
          while IFS='=' read -r package version; do
            [ -n "$package" ] || continue
            echo "catching up $package $version"
            rm -rf "../catchup"
            git worktree add --detach "../catchup" "$package/v$version"
            python tools/build_wiki.py --repo "../catchup" --out wiki \
              ${{ steps.released.outputs.args }} --archive "$package=$version"
            git worktree remove --force "../catchup"
          done < missing.txt
          # An --archive run also rebuilds the live channels and Home from the tree it
          # read, here an older tag: rebuild them from this run's checkout once more.
          if [ -s missing.txt ]; then
            python tools/build_wiki.py --repo . --out wiki ${{ steps.released.outputs.args }}
          fi
          rm -f missing.txt

      - name: Push what changed
        working-directory: wiki
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches this tree."
            exit 0
          fi
          git commit -m "Publish ${GITHUB_REF_NAME}"
          git push

  # The same live pages, where a search engine reads them: GitHub serves the wiki with
  # x-robots-tag: none (#1180). No needs: on publish, so either can fail alone; and from
  # main only: a tag makes an archive, which stays on the wiki, and a dispatch from
  # another branch must not publish that branch.
  # The workflow's one concurrency slot can let a queued tag run replace a queued push; the next push to main redeploys.
  pages:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the released versions are read from the tags

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The publish job's own step: Home's table shows the same versions the wiki's does.
      - name: The released version of each package
        id: released
        run: |
          set -euo pipefail
          args=""
          for package in $(python -c "import json; print(' '.join(sorted(json.load(open('docs/wiki-map.json'))['packages'])))"); do
            version=$(git tag --list "$package/v*" | sed "s|$package/v||" | sort -V | tail -1)
            if [ -n "$version" ]; then
              args="$args --released $package=$version"
            fi
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Build the site
        env:
          RELEASED: ${{ steps.released.outputs.args }}
        run: |
          python tools/build_site.py --repo . --out artifacts/site $RELEASED   # unquoted: one argument per word
          dotnet tool restore
          dotnet docfx artifacts/site/docfx.json --warningsAsErrors

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/site/_site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
