name: Benchmarks (nightly)

# CI compiles the benchmarks -- bench/ is in Lodestar.slnx -- and never runs one, so a
# change that makes a measurement wrong rather than uncompilable is found by hand or not
# at all (#11). This runs them, and only the ones a change could have moved:
# bench/bench-map.json says which classes each source directory feeds, and
# tools/check_bench_map.py refuses a [Benchmark] class the map does not name.
#
# It publishes to docs/guides/nightly_run.md and never to docs/guides/performance.md.
# That page's numbers are comparable because it names its machine; a hosted runner is a
# shared VM whose hardware differs between runs, so only ratios taken inside one run mean
# anything here. The page says so itself.
#
# main is protected by a ruleset with no bypass actors, so this cannot push there --
# neither can it push to any other branch a reviewer expects to stay reviewed, so it
# opens a pull request everywhere, against whichever ref it was dispatched on. A
# scheduled run is always main; workflow_dispatch can target a feature branch instead,
# which is what lets one measure a change before it merges rather than after.

on:
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC, after the day's merges have settled
  workflow_dispatch:
    inputs:
      all:
        description: 'Run every mapped class, ignoring what changed'
        type: boolean
        default: false

concurrency:
  group: bench-nightly
  cancel-in-progress: false

jobs:
  measure:
    name: Measure what changed
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Four hours, not two: at two this job was killed two seconds after its last step on
    # 2026-09-16, having measured 27 of the 53 classes -- every one of them from the first
    # project the loop walks, so Stats, Survival and Gpu had not started. A full sweep is longer
    # than this window -- the classes spent their whole 150-minute budget on 2026-10-12, owing 49,
    # and 21 comparisons needed about 110 --
    # so the classes start until BUDGET_MINUTES and are cut at CLASS_STOP_BY_MINUTES, the
    # comparisons start until their own deadline and are cut at STOP_BY_MINUTES, and what a
    # night does not reach is asked for first the next, save what it cut, which goes last.
    #
    # Per job rather than on the workflow, because the two jobs are not the same risk.
    # This one runs the measured branch's own code -- dotnet on bench/, the corpus
    # generators, bench/compare.py -- so it holds the smallest token that still lets it
    # publish the wiki: no pull-requests, and above all no workflows (#464).
    permissions:
      contents: write
    env:
      # When a comparison still running is cut, counted from the job's start: it leaves the steps
      # after it twelve minutes under timeout-minutes, where 2026-09-25's run spent about one on
      # all of them; the pull request is the separate publish job (#1687).
      STOP_BY_MINUTES: 228
    outputs:
      selected: ${{ steps.page.outputs.selected }}
      handed: ${{ steps.handed.outcome == 'success' }}
      compared: ${{ steps.page.outputs.compared }}
      moved: ${{ steps.moved.outputs.moved }}
    steps:
      # The clock the comparisons' deadline counts from: the job's own start, so the whole of
      # timeout-minutes is accounted for, not just the steps that happen to carry a budget (#1687).
      - name: Note when the job started
        run: echo "JOB_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the baseline commit is read from the previous page

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # An absent or unreadable baseline means "we do not know what moved", and the safe
      # reading of not knowing is to measure everything -- select_benchmarks.py does that.
      #
      # On main, "since the page's own recorded baseline" is the right question: consecutive
      # scheduled runs partition every merge. On a feature branch it is the wrong one -- the
      # page's baseline travels forward every time the branch merges main in, so it can predate
      # other PRs already merged to main that the branch picked up that way, and the selection
      # below would then cover their classes too, not just this branch's own diff (#379). There
      # the question is "since this branch diverged from main", which is its merge-base with it.
      - name: The commit the previous run stopped at
        id: baseline
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" = "main" ]; then
            # The page's baseline, what it owes (#650) and what it cut, which only orders tomorrow's
            # selection: a page a night old, its pull request unmerged, costs minutes, not a verdict.
            python tools/render_nightly.py --markers | tee -a "$GITHUB_OUTPUT"
          else
            git fetch origin main --quiet
            sha=$(git merge-base origin/main HEAD)
            echo "sha=$sha" | tee -a "$GITHUB_OUTPUT"
            printf 'owed=\ncut=\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Which classes and comparisons that makes worth re-running
        id: select
        # Through the environment, not interpolated into the script: the owed and cut lists are read
        # from a page file, and a quote in one would otherwise be shell code.
        env:
          ALL: ${{ inputs.all }}
          SINCE: ${{ steps.baseline.outputs.sha }}
          OWED: ${{ steps.baseline.outputs.owed }}
          CUT: ${{ steps.baseline.outputs.cut }}
        run: |
          set -euo pipefail
          if [ "$ALL" = "true" ] || [ -z "$SINCE" ]; then
            since=(--all)
          else
            since=(--since "$SINCE")
          fi
          # Everything selected or not, what is owed goes first and what was cut last, so one that does
          # not fit the window takes what the rest leave (#1687, #1694). Comparisons are owed like classes.
          # `--x=value`: a page-derived value starting with '-' would read as an option.
          python tools/select_benchmarks.py "${since[@]}" --owed="$OWED" --cut="$CUT" > selected.txt
          python tools/select_benchmarks.py "${since[@]}" --owed="$OWED" --cut="$CUT" --harnesses \
            > harnesses.txt
          count=$(wc -l < selected.txt | tr -d ' ')
          harnesses=$(wc -l < harnesses.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "harnesses=$harnesses" >> "$GITHUB_OUTPUT"
          echo "total=$((count + harnesses))" >> "$GITHUB_OUTPUT"
          echo "$count class(es):"; cat selected.txt
          echo "$harnesses comparison(s):"; cat harnesses.txt

      # generate_vocabs.py imports sentencepiece. Same lock file and same flags as ci.yml:
      # one source of truth for what this repository's Python needs.
      - name: Install tool dependencies
        if: steps.select.outputs.total != '0'
        # A block scalar, not a plain one: ':all: ' carries a colon and a space, which
        # ends a plain scalar and made the whole file unparseable. ci.yml writes it the
        # same way, and copying the command without its shape is what broke this.
        run: |
          pip install --only-binary :all: --require-hashes -r tools/requirements.lock.txt

      # Six of the thirteen classes read bench/corpus/vocabs, which is ~3 MB of generated
      # data git ignores on purpose. A fresh runner has none of it and BenchCorpus throws
      # at [GlobalSetup] rather than measuring, so this is not optional.
      - name: Generate the vocabularies the benchmarks read
        if: steps.select.outputs.total != '0'
        run: python bench/corpus/generate_vocabs.py

      - name: Run them
        id: run
        if: steps.select.outputs.count != '0'
        # A step that raises costs neither the comparisons nor the page, the run's product, as a
        # timeout did (#1687, #1695); the last step turns the run red for it.
        continue-on-error: true
        env:
          # The deadline is when the last class may *start*. One still running at
          # CLASS_STOP_BY_MINUTES is cut and owed rather than left to run on: a cut class writes no
          # report, which is better than a page the job never writes. Both are counted from the
          # job's start, as the comparisons' are, so the setup's minutes are in them (#1687).
          #
          # The cut is also the comparisons' share: they start from it at the latest, so they have
          # at least until their own deadline below whatever the classes do. On 2026-10-12 the
          # classes spent their whole budget, and with no bound on them the comparisons got none.
          BUDGET_MINUTES: 150
          CLASS_STOP_BY_MINUTES: 165
        run: |
          set -euo pipefail
          # Each class runs in the project that declares it: a filter handed to a project without
          # it matches nothing and BenchmarkDotNet still exits 0, so StatsBenchmarks was listed as
          # re-run and never measured (#586). run_bounded.PROJECTS is the one list of those projects.
          #
          # bench/Lodestar.Gpu.Benchmarks is among them so its classes are selected and run,
          # not so its numbers are believed: this runner has no GPU, so ILGPU falls back
          # to its CPU accelerator and the row measures correctness-under-load rather
          # than the 5-10x gate. That gate is measured on a named machine and published
          # by hand -- bench/README.md's GPU gate has the protocol, and the benchmark prints which
          # accelerator produced each figure.
          #
          # One class at a time, against a deadline. Measured on 2026-09-16, a class costs
          # 2.3 minutes on average; the map now names 114, about 260 minutes, so a night measures
          # what the budget holds and owes the rest.
          #
          # The order matters more than the total, because the budget is spent in it: classes go
          # in the selection's order, the owed ones first whichever project holds them, so the
          # tail a short night drops is not the tail it dropped before (#1687). Walking project by
          # project, the first one's 31 of 53 classes kept the others behind every night.
          #
          # A killed job is what this avoids, and it is worse than a short one: it writes no
          # page, so the baseline never advances and the next night selects the same classes
          # again (#650).
          #
          # Stopping deliberately is what makes that impossible. The cost is one `dotnet run`
          # per class rather than per project -- seconds each, against hours of exposure.
          deadline=$(( JOB_STARTED + BUDGET_MINUTES * 60 ))
          stop=$(( JOB_STARTED + CLASS_STOP_BY_MINUTES * 60 ))
          : > owed.txt
          : > failed.txt
          : > classes-run.txt
          : > cut.txt
          while read -r name; do
            [ -n "$name" ] || continue
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "$name" >> owed.txt
              continue
            fi
            left=$(( stop - $(date +%s) ))
            # run_bounded finds the class's project and runs it alone, cut with its process group at the
            # class stop (#1687); it settles the class, and what it raises fails this class alone (#1695).
            python tools/run_bounded.py --name "$name" --seconds "$left" || {
                echo "::error::$name: tools/run_bounded.py exited $?"
                # Failed unless it settled the name before it fell over.
                grep -qxF "$name" classes-run.txt owed.txt failed.txt 2>/dev/null || echo "$name" >> failed.txt
              }
          done < selected.txt

          if [ -s owed.txt ]; then
            echo "::warning::out of budget with $(wc -l < owed.txt) class(es) unmeasured; \
              they are carried to the next run"
            sort -u owed.txt -o owed.txt
            cat owed.txt
          fi

      # The claim this project makes -- faster than rapidfuzz -- lives here and nowhere
      # else: a BenchmarkDotNet class measures us against ourselves. Both sides run in
      # the same job, on the same VM, in the same minutes, which is what makes the ratio
      # readable where the absolutes are not.
      - name: Compare against Python
        id: compare
        if: steps.select.outputs.harnesses != '0'
        continue-on-error: true
        env:
          # Counted from the job's start. From 2026-09-26 the comparisons grew to 21, about 110
          # minutes, and with no deadline of their own every night ran into timeout-minutes: 240,
          # was killed, wrote no page and re-selected everything (#1687). None starts past 210
          # minutes; one still running at STOP_BY_MINUTES is cut with its process group and owed.
          COMPARISON_START_BY_MINUTES: 210
          # The groups this prints have to wrap the commands' own output, which a buffered stdout
          # would print after them.
          PYTHONUNBUFFERED: '1'
        run: |
          set -euo pipefail
          touch owed.txt failed.txt cut.txt
          # It reads harnesses.txt and writes harnesses-run.txt, owed.txt, failed.txt and cut.txt.
          python tools/run_comparisons.py \
            --started "$JOB_STARTED" \
            --start-by "$COMPARISON_START_BY_MINUTES" \
            --stop-by "$STOP_BY_MINUTES" \
            --generated bench/corpus/generate_vocabs.py

      # The marker this writes is what the *next* run reads (render_nightly.py's own docstring).
      # On main that must advance to tonight's tip, so a scheduled run partitions cleanly against
      # the next one. On a feature branch it must not: advancing it to the branch's own tip is
      # what corrupts main's baseline chain if this page ever reaches main by merging the branch
      # in (#379) -- so a non-main run re-states the same merge-base it just read instead,
      # a commit already truly on main's own line, which is a no-op if it ever gets there.
      #
      # --branch, on top of that: a non-main run writes docs/guides/branch/ instead of the
      # canonical docs/guides/ page. That is what actually keeps this branch's own numbers off
      # main -- two different files can never collide on merge, where the baseline fix above
      # only bounded what value a collision would carry. The branch still gets its own current
      # numbers on every dispatch; main's copy is only ever written by a run on main itself.
      - name: Write the page
        id: page
        env:
          TARGET_REF: ${{ github.ref_name }}
          CUT_BEFORE: ${{ steps.baseline.outputs.cut }}
        run: |
          set -euo pipefail
          # What a dying step left unsettled is owed and asked for last, and a name cut before and
          # still owed stays last (#1694, #1695): nightly_outcomes.carry, which the tests run.
          touch classes-run.txt harnesses-run.txt owed.txt failed.txt cut.txt
          python tools/nightly_outcomes.py carry --cut-before="$CUT_BEFORE"
          # Named here, not by the measuring steps, whose last line a raise would skip.
          echo "selected=$(tr '\n' ' ' < classes-run.txt)" >> "$GITHUB_OUTPUT"
          echo "compared=$(tr '\n' ' ' < harnesses-run.txt)" >> "$GITHUB_OUTPUT"
          if [ "$TARGET_REF" = "main" ]; then
            baseline_for_page="${{ github.sha }}"
            branch_flag=""
          else
            baseline_for_page="${{ steps.baseline.outputs.sha }}"
            branch_flag="--branch"
          fi
          # The reports are found by the script in BenchmarkDotNet's own output directory,
          # not passed in: no path it touches comes from an argument.
          # shellcheck disable=SC2046
          python tools/render_nightly.py \
            --commit "${{ github.sha }}" \
            --baseline "$baseline_for_page" \
            --runner "${{ runner.os }} / ${{ runner.arch }} (GitHub hosted)" \
            --selected $(cat classes-run.txt 2>/dev/null | tr '\n' ' ') \
            --harnesses $(cat harnesses-run.txt 2>/dev/null | tr '\n' ' ') \
            --owed $(sort -u owed.txt 2>/dev/null | tr '\n' ' ') \
            --failed $(sort -u failed.txt 2>/dev/null | tr '\n' ' ') \
            --cut $(sort -u cut.txt 2>/dev/null | tr '\n' ' ') \
            $branch_flag

      # Cloned here, ahead of "Open the pull request", so the aggregate below can read
      # this repo's history and land in the same pull request as tonight's own page.
      - name: Clone the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      # The nightly's memory (#672). Tonight is compared with the series before it joins it, so a
      # reading is never measured against itself; the section this appends to the page, the job
      # summary and one ::warning:: per new movement are the routes a maintainer sees. It runs after
      # the wiki clone and before the wiki publish, so the wiki's history holds every earlier night on
      # main -- merged pull request or not -- and not yet tonight. It never
      # fails the job: the page is the product of the run, and a movement is a finding to read,
      # not a reason to withhold the numbers it was found in. docs/guides/nightly_run.md has the thresholds.
      - name: Report the ratios that moved
        id: moved
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          page=docs/guides/nightly_run.md
          branch_flag=""
          if [ "$TARGET_REF" != "main" ]; then
            page=docs/guides/branch/nightly_run.md
            branch_flag="--branch"
          fi
          # shellcheck disable=SC2086
          python tools/nightly_series.py compare $branch_flag \
            --date "$(date -u +%Y-%m-%d)" --wiki wiki | tee moved.txt
          # The last line is "<n> new, <m> persisting"; the pull request's body repeats it, and the
          # section the script appended to the page is copied into the job summary.
          echo "moved=$(tail -n 1 moved.txt)" >> "$GITHUB_OUTPUT"
          sed -n '/^## Ratios that moved$/,$p' "$page" >> "$GITHUB_STEP_SUMMARY"

      # Only a run on main joins the series: a branch's readings measure code main may never
      # carry, and the series is what every later night on main is compared with (#379's reason
      # for the separate branch page, applied to the data behind it).
      - name: Record tonight in the series
        if: github.ref_name == 'main'
        run: |
          python tools/nightly_series.py record --date "$(date -u +%Y-%m-%d)" --wiki wiki

      # nightly_run.md keeps only tonight's selection; a class quiet for weeks needs
      # its last reading kept somewhere, which is what this walks the wiki's own git
      # log for. Tonight's own fresh reports, still on disk, take priority within it.
      # --branch mirrors "Write the page" above, for the same reason (#379).
      - name: Aggregate the latest known result per method
        env:
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          branch_flag=""
          [ "$TARGET_REF" = "main" ] || branch_flag="--branch"
          python tools/render_benchmark_latest.py --wiki wiki --commit "${{ github.sha }}" $branch_flag

      # The wiki is published from docs/, so the page reaches readers without waiting for
      # the pull request to be merged. Deliberate: the numbers are the point of the run,
      # and the pull request is the record of them rather than their gate.
      #
      # This publishes the LIVE channel from the tree as checked out, exactly as wiki.yml
      # does on a push to main. It deliberately passes no --released and no --archive: a
      # nightly must not freeze an archive directory, which belongs to a release tag.
      #
      # Gated to main: workflow_dispatch can target a feature branch (see the header
      # comment and #349), and without this guard that branch's whole docs/ tree -- not
      # just its own nightly_run.md -- would overwrite the live wiki everyone else reads.
      # The pull request above still opens against whatever ref was dispatched; only this
      # side-channel publish is restricted (#367).
      - name: Publish the page
        if: github.ref_name == 'main'
        run: python tools/build_wiki.py --repo . --out wiki

      - name: Push what changed
        if: github.ref_name == 'main'
        working-directory: wiki
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches this tree."
            exit 0
          fi
          git commit -m "Nightly benchmark run for $(date -u +%Y-%m-%d)"
          git push

      # The two pages cross into `publish` as an artifact rather than staying in this
      # job's tree: that job holds `workflows: write` and must not run anything this
      # branch could have written (#464).
      - name: Hand the pages to the publish job
        id: handed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-pages
          # A rerun re-uploads into the same run and the default keeps both, leaving two artifacts
          # of one name -- measured on main, two doc-tests-net10 artifacts on one run (#1060).
          overwrite: true
          # Both spellings are listed because only one exists: main writes docs/guides/,
          # a dispatched branch writes docs/guides/branch/ (#379).
          #
          # selected.txt is load-bearing and not read by `publish`: upload-artifact
          # roots the archive at the common ancestor of what it matched, so without a
          # file at the workspace root the pages would extract one directory too high.
          path: |
            docs/guides/nightly_run.md
            docs/guides/benchmark_latest.md
            bench/nightly/ratios.csv
            docs/guides/branch/nightly_run.md
            docs/guides/branch/benchmark_latest.md
            selected.txt
          retention-days: 7

      # Last, after the page, the wiki and the hand-off: a failure is reported on the page and the
      # run goes on, but a run that ends green hides it once the next page drops it, since a failure
      # is not owed (#1687). The publish job still opens the pull request.
      - name: Fail on what failed tonight
        # After any failure but a cancel: a later step failing must not hide what failed earlier.
        if: ${{ !cancelled() }}
        env:
          RUN_OUTCOME: ${{ steps.run.outcome }}
          COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        run: |
          set -euo pipefail
          status=0
          if [ -s failed.txt ]; then
            echo "::error::$(sort -u failed.txt | wc -l) class(es) or comparison(s) failed: $(sort -u failed.txt | tr '\n' ' ')"
            status=1
          fi
          if [ "$RUN_OUTCOME" = failure ] || [ "$COMPARE_OUTCOME" = failure ]; then
            echo "::error::a measuring step raised (Run them: $RUN_OUTCOME, Compare: $COMPARE_OUTCOME)"
            status=1
          fi
          exit "$status"

  # Split out of `measure` because this is the job that pushes and opens the pull
  # request, and it must not run the measured branch's code: every step here is a
  # pinned action, git or gh. `workflows` is NOT among GitHub's permission scopes, and no
  # `permissions:` block can change that, so this token can never push a ref whose
  # .github/workflows/ differs from main's; the guard below keeps that from costing a run.
  publish:
    name: Open the pull request
    needs: measure
    # Also when measure failed only on its last step, which turns a reported failure red: the pages
    # were handed over before it, and the run's numbers still deserve their pull request.
    if: ${{ !cancelled() && needs.measure.outputs.handed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-pages

      - name: Open the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          # A ref name, not free text, but still routed through env rather than
          # interpolated straight into the script -- the same reason gh's own
          # docs give for every github.* value a workflow turns into a command.
          TARGET_REF: ${{ github.ref_name }}
          SELECTED: ${{ needs.measure.outputs.selected }}
          COMPARED: ${{ needs.measure.outputs.compared }}
          MOVED: ${{ needs.measure.outputs.moved }}
        run: |
          set -euo pipefail
          if [ "$TARGET_REF" = "main" ]; then
            pages="docs/guides/nightly_run.md docs/guides/benchmark_latest.md bench/nightly/ratios.csv"
          else
            pages="docs/guides/branch/nightly_run.md docs/guides/branch/benchmark_latest.md"
          fi
          # GITHUB_TOKEN cannot create a ref whose .github/workflows/ differs from the
          # default branch's, and no `permissions:` key can grant it that (decision
          # 0067). Asked anyway, the push is rejected -- after the measurement, which is
          # what run 43 spent a nightly window on (#464). So the run publishes what it
          # measured to the job summary instead, and says why. Always false on main.
          git fetch origin main --quiet --depth=1
          if ! git diff --quiet FETCH_HEAD HEAD -- .github/workflows/; then
            {
              echo "## Nightly measured, not opened as a pull request"
              echo
              echo "This ref changes \`.github/workflows/\`, and \`GITHUB_TOKEN\` cannot create a"
              echo "branch carrying workflow files that differ from \`main\`'s. The pages are"
              echo "below and in the \`nightly-pages\` artifact; this workflow's publish job says why."
              # shellcheck disable=SC2086
              for page in $pages; do
                echo; echo "<details><summary>$page</summary>"; echo
                cat "$page"
                echo; echo "</details>"
              done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Workflow files differ from main; published to the job summary instead of a pull request."
            exit 0
          fi
          # Staged first: docs/guides/branch/ is untracked on a branch's first-ever
          # nightly, and a plain `git diff` says nothing about an untracked file --
          # it looked unchanged and no PR ever opened, generated content included.
          # shellcheck disable=SC2086
          git add -- $pages
          if git diff --cached --quiet -- $pages; then
            echo "neither page changed; nothing to open"
            exit 0
          fi
          # Slugged into the branch name too: two refs measured the same day must
          # not share bench/nightly-<date>, or the second run's force-with-lease
          # push silently replaces the first's PR instead of opening its own.
          ref_slug=$(echo "$TARGET_REF" | tr '/' '-')
          branch="bench/nightly-${ref_slug}-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          # shellcheck disable=SC2086
          git add $pages
          git commit -m "Nightly benchmark run for $(date -u +%Y-%m-%d)"
          # Named rather than left to git's own wording: run 43's rejection read in
          # the run list like a failed benchmark, which is what #464 asks to end.
          if ! git push --force-with-lease origin "$branch"; then
            echo "::error::Could not push $branch. The measurements succeeded; only the" \
                 "publish failed -- read this as a push problem, not a benchmark one (#464)."
            exit 1
          fi
          gh pr create --head "$branch" --base "$TARGET_REF" \
            --title "Nightly benchmark run for $(date -u +%Y-%m-%d)" \
            --body "Generated by \`.github/workflows/bench-nightly.yml\`. Ratios only — see the page for why a hosted runner's absolutes are not comparable. Classes re-run: ${SELECTED:-none}. Comparisons run: ${COMPARED:-none}. Ratios that moved (see the page's last section): ${MOVED:-not compared}." \
            || gh pr edit "$branch" --title "Nightly benchmark run for $(date -u +%Y-%m-%d)"
