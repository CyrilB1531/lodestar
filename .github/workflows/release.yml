name: Release

# Publishes ONE NuGet package to GitHub Packages when a per-package tag is
# pushed, e.g.:  git tag Lodestar.Fuzzy/v0.3.0 && git push origin Lodestar.Fuzzy/v0.3.0
#
# The three packages version independently, so a tag names which one it releases
# (see docs/decisions/0012-per-package-versioning.md). The old repository-wide
# `v*` tag is retired: it can no longer mean anything, since there is no single
# version left for it to designate.
#
# GitHub Packages authenticates with the automatic GITHUB_TOKEN — no nuget.org
# account and no manually-created API key are required.

on:
  push:
    tags: ['Lodestar.*/v*']

permissions:
  contents: write   # required to create the GitHub Release at the end
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The `Next release` step asks `git tag --contains` which releases carry a
          # merge commit, and a shallow clone has neither the tags nor the history to
          # answer. Without this it reports every pull request as still waiting.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The tag is <PackageId>/v<Version>. Both halves stay in the environment
      # rather than being interpolated into a script: GitHub's own guidance
      # treats a ref name as untrusted, and in a job that can push packages,
      # interpolated data would BE the script.
      - name: Parse the tag
        id: tag
        run: |
          {
            echo "package=${GITHUB_REF_NAME%/v*}"
            echo "version=${GITHUB_REF_NAME##*/v}"
          } >> "$GITHUB_OUTPUT"

      # The version is declared in src/<Package>/Version.props and nowhere else.
      # The tag does not set it — it only says which declared version to release,
      # and this step refuses the job if the two disagree. That keeps the
      # repository authoritative, and means nothing derived from the tag ever
      # reaches `dotnet pack` at all.
      - name: The tag matches the declared version
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          case "$PACKAGE" in
            Lodestar.Abstractions|Lodestar.Text|Lodestar.Embeddings|Lodestar.Fuzzy|Lodestar.Metrics|Lodestar.Conformal|Lodestar.Decomposition|Lodestar.Onnx|Lodestar.Stats|Lodestar.Stats.Regression|Lodestar.Survival|Lodestar.Gpu|Lodestar.Extensions.AI|Lodestar.Extensions.MathNet|Lodestar.Cluster|Lodestar.Preprocessing) ;;
            *) echo "::error::Unknown package '$PACKAGE'."; exit 1 ;;
          esac
          declared=$(dotnet msbuild "src/$PACKAGE" -getProperty:Version -p:TargetFramework=net10.0)
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::Tag says $VERSION, src/$PACKAGE declares $declared. Bump Version.props and retag."
            exit 1
          fi
          echo "$PACKAGE $declared"

      # The Release body is the changelog entry, and a missing one stops the job here
      # rather than after the push -- the same reasoning as the two version checks above,
      # where the fix is still cheap. CONTRIBUTING.md makes the entry item 7 of the
      # definition of done and notes that nothing gates it, "precisely because four lots
      # shipped without it"; this is that gate, at the one moment it can still be applied.
      - name: The changelog carries this release
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: python3 tools/changelog_section.py "$PACKAGE" "$VERSION" > release-notes.md

      - name: Test
        run: dotnet test --configuration Release

      # No -p:Version: the csproj is the source of truth, and the step above has
      # already proved the tag agrees with it.
      - name: Pack
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
        run: dotnet pack "src/$PACKAGE" --configuration Release -o artifacts

      - name: The shipped dependency graph is the intended one
        run: python3 tools/check_nuspec_dependencies.py artifacts

      # No --skip-duplicate. Re-releasing a version the feed already has is not
      # a no-op worth tolerating: with the tag no longer setting the version, the
      # way to reach this line twice is to tag a release without bumping
      # Version.props first, and skipping the duplicate reported that as success
      # while the change stayed unpublished. A rejected push says so instead.
      - name: Push to GitHub Packages
        env:
          OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --source "https://nuget.pkg.github.com/$OWNER/index.json" \
            --api-key "$GITHUB_TOKEN"

      # After the push, so a Release exists only for a version that actually shipped.
      # 35 tags had 4 Releases before this step existed (#626).
      - name: Publish the GitHub Release
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          VERSION: ${{ steps.tag.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$PACKAGE $VERSION" \
            --notes-file release-notes.md \
            artifacts/*.nupkg

      # `Next release` holds what has merged and not shipped (#628). A tag moves the items
      # this package has now published onto the dated milestone -- but only the ones whose
      # every package has shipped. #490 touched Embeddings, Metrics and Text; tagging two of
      # the three left its Metrics half waiting, and moving it off `Next release` then would
      # have said the opposite. So an item leaves only when no package it ships is still
      # behind, which is the rule the manual pass reached the hard way.
      - name: Move what this tag published off `Next release`
        env:
          PACKAGE: ${{ steps.tag.outputs.package }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date=$(git log -1 --format=%ad --date=short "$GITHUB_REF_NAME")
          target="Release $date"
          if ! gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
                 --jq '.[].title' | grep -qxF "$target"; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/milestones" \
              -f title="$target" -f state=closed -f due_on="${date}T00:00:00Z" \
              -f description="The batch published on $date." >/dev/null
          fi
          next=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
                 --jq '.[] | select(.title=="Next release") | .number')
          [ -z "$next" ] && { echo "no 'Next release' milestone; nothing to move."; exit 0; }

          gh api "repos/$GITHUB_REPOSITORY/issues?milestone=$next&state=all&per_page=100" \
            --paginate --jq '.[] | select(.pull_request != null) | .number' > pending.txt || true
          while read -r pr; do
            [ -z "$pr" ] && continue
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.merge_commit_sha // empty')
            [ -z "$sha" ] && continue
            gh api "repos/$GITHUB_REPOSITORY/pulls/$pr/files?per_page=100" --paginate \
              --jq '.[].filename' > files.txt
            ships=$(python3 tools/classify_change.py < files.txt | sed -n 's/^ships=//p')
            [ -z "$ships" ] && continue
            waiting=no
            IFS=','; for p in $ships; do
              git tag --list "$p/v*" --contains "$sha" | grep -q . || waiting=yes
            done; unset IFS
            if [ "$waiting" = "no" ]; then
              number=$(gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&per_page=100" \
                       --jq ".[] | select(.title==\"$target\") | .number")
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$pr" \
                -F milestone="$number" >/dev/null
              echo "#$pr fully shipped -> $target"
            else
              echo "#$pr still waiting on a package, stays on 'Next release'"
            fi
          done < pending.txt

      - name: Upload packages as build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-packages
          path: artifacts/*.nupkg
