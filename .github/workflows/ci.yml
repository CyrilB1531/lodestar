name: CI

on:
  push:
    branches: [main]
  # No branches filter: a PR stacked on an unmerged feature branch (base is that
  # branch, not main) still gets every job here, as the SonarQube Cloud workflow's own
  # unfiltered pull_request trigger did before it merged into build-test (#857). Filtered by base, this workflow used to skip
  # entirely on such a PR -- only SonarCloud ran, measured on #384 (#386).
  pull_request:

concurrency:
  # A new push to a pull request supersedes the run on its previous commit, so that run is
  # cancelled; a push to main keeps one run per commit (#835).
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (markdown + C# format)
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check_unreleased.py asks the tags what has shipped, and a checkout without them
          # makes every package read as entirely unpublished. `fetch-tags` costs a ref fetch
          # rather than the whole history that `fetch-depth: 0` would pull.
          fetch-tags: true
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Markdown lint
        # Pinned and --ignore-scripts: `npx --yes <name>` resolves the latest
        # version on demand and runs its lifecycle scripts, so the code executed
        # in CI could change with no commit here.
        run: >
          npx --yes --ignore-scripts markdownlint-cli2@0.23.2
          "README.md" "CONTRIBUTING.md" "docs/**/*.md" "tools/README.md" "bench/README.md"
      - name: C# format check
        run: dotnet format Lodestar.slnx --verify-no-changes
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      # tools/tests exercises generate_sonar_globalconfig.py and
      # check_machine_paths.py, both of which import nothing beyond the standard
      # library and pytest -- scikit-learn, tokenizers, nltk and the rest of
      # tools/requirements.lock.txt are unused here. Installed anyway, deliberately:
      # a second, narrower lock for these two test files would be a second hashed
      # graph to keep in sync with tools/requirements.txt by hand, which is exactly
      # the kind of drift check_version_floor.py exists to catch elsewhere in this
      # repository -- and --only-binary :all: means the install is wheels-only with
      # nothing to compile, so the wall-clock cost of the extra packages is a pip
      # resolve, not a build. One lock file, one source of truth.
      - name: Install tool dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r tools/requirements.lock.txt
      - name: Tool tests
        run: python -m pytest tools/tests -q
      # An absolute path under a home directory reaches a file by being pasted
      # from a terminal, which is exactly when nobody is thinking about what the
      # string contains. Ten of them were committed to this public repository
      # before anything looked for them.
      - name: No machine paths in tracked files
        run: python tools/check_machine_paths.py
      # A plan's task reports live in an ignored workspace deleted when the plan
      # finishes, so a comment citing one is dangling from its first commit (#730).
      - name: No citation of a plan workspace file
        run: python tools/check_sdd_citations.py
      # CI installs the oracle dependencies from the lock, so a pin added to
      # requirements.txt alone is invisible to anyone whose venv already holds it --
      # measured on #604, where it cost a red `Oracles are reproducible` job (#605).
      - name: requirements.txt and its lock agree
        run: python tools/check_requirements_lock_sync.py
      # Lodestar.Gpu's suites run where there is no card, and GpuContext.Create() falls
      # back rather than throwing -- so a bare Create() is green on a developer machine
      # using the GPU and green on the runner using the processor, asserting different
      # things in each place (#444).
      - name: GPU correctness tests force the CPU accelerator
        run: python tools/check_gpu_tests_force_cpu.py
      # Wired once the tree could pass it (#155). The report line prints how many
      # blocks carry a long-comment: marker -- nine when this landed -- and does not
      # fail on that number: the marker is a judgment a review reads, not a quota.
      - name: Comment budgets
        run: |
          python tools/check_comment_length.py
          python tools/check_comment_length.py --report
      # A library that writes to a console its caller did not open decides for an
      # application it cannot see, and src/ has never done it -- this keeps that true by
      # construction. Under bench/ ten calls narrating a run had accumulated because each
      # was individually harmless; the four that remain carry what no file does and say so
      # on the line, where a reviewer can disagree with the reason.
      - name: No unexplained Console call in src/ or bench/
        run: |
          python tools/check_no_console_writeline.py
          python tools/check_no_console_writeline.py --report
      # The nightly run (#11) selects benchmark classes from bench/bench-map.json, so a
      # class missing from it is never re-run and stops being measured in silence. The map
      # cannot be derived -- FuzzBenchmarks names only Fuzz and reaches Lcs through Indel --
      # so it is hand-written and this is what keeps it complete.
      - name: Every benchmark class is in the bench map
        run: python tools/check_bench_map.py
      # Seven hard-coded pack lists exist; the six something reads stayed current and
      # the README's did not, so the command it calls runnable could not restore the
      # sample it is followed by (#597). These two give both documents a source of
      # truth, the way check_bench_map.py gave the nightly one after #586.
      - name: The README packs what the sample references
        run: python tools/check_readme_pack_loop.py
      - name: CLAUDE.md's package table matches src/
        run: python tools/check_claude_md_packages.py
      # Three hand-written texts understated the repository by seven packages, each true
      # when written and each sitting next to a list something already gated: the README's
      # Publishing prose beside its checked pack loop, its Structure tree, and CLAUDE.md's
      # quick-commands loop beside the table above (#688).
      - name: README prose and CLAUDE.md's pack loop name every package
        run: python tools/check_readme_packages.py
      # Lodestar.Fuzzy carried two commits merged on 2026-09-01 and never published, and
      # nothing said so for ten days (#628). This reads the tags and main, which cannot
      # drift, against what src/<Package>/Version.props declares. Unpublished work is the
      # normal state between a merge and a release, so the table is printed and only a
      # version declared past its own tag fails.
      - name: What each package has merged and not published
        run: python tools/check_unreleased.py
      # Two of those hard-coded lists decide what can be released, and src/ had grown
      # past both: four of the eight packages 0.6.0 meant to publish could not be
      # published at all (#610). Neither list can read a source of truth the way
      # wiki.yml now reads docs/wiki-map.json -- GitHub wants `options:` literal, and
      # the `case` arm must not derive what it accepts from what the tag says -- so
      # they stay hand-written and this is what keeps them current.
      - name: Both release workflows list every package in src/
        run: python tools/check_release_workflow_packages.py
      # Decision 0041 names a sample after its class, so a public type without one is a
      # type nobody can find an example of. Only the packages already split are enforced;
      # the rest still carry their Lot* files, and #280 closes when that list is empty.
      - name: Every public class has a sample of its own
        run: python tools/check_sample_coverage.py
      # A mirror pins its library to netstandard2.0, but SetTargetFramework does not travel
      # across a PackageReference -- so a mirror that pins only its own library still loads
      # its dependencies' net10.0 build, green and half-blind. Lodestar.Text and
      # Lodestar.Decomposition were doing exactly that for 832 tests (#529).
      - name: Every netstandard2.0 mirror really mirrors
        run: python tools/check_netstandard_guards.py
      # An ADR is immutable, so the decision that gets amended cannot be edited to name
      # its amendment: 17 records declared `amends` or `supersedes` onto 15 decisions and
      # not one of the 15 pointed forward. docs/decisions/index.yaml carries that
      # direction, generated from each record's frontmatter (#630, decision 0106).
      - name: Every ADR declares a readable frontmatter
        run: python tools/check_adr_frontmatter.py
      - name: The ADR index matches the records it is generated from
        run: python tools/check_adr_index_sync.py
      # The index solves nothing unread: citing 0101 without reaching 0103 states the
      # opposite of what was decided, and that reader is not looking for an index.
      - name: CLAUDE.md and CONTRIBUTING.md send a reader to the ADR index
        run: python tools/check_adr_index_is_cited.py
      # An accepted ADR is never edited, addition included -- "Amend 0004 in a decision
      # of its own instead of editing it" is why even a `> update:` blockquote no longer
      # passes here (#399). Only a pull_request event has a base commit to diff against;
      # a push to main is already merged, so there is nothing left for this to catch.
      - name: No already-accepted ADR is touched by this pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          python tools/check_adr_immutable.py --base "${{ github.event.pull_request.base.sha }}"
      # S1192 is reported by SonarCloud rather than by the build, because the file it
      # keeps tripping is Python and AnalysisMode=All covers only the C#. Twice now a
      # green pull request has failed the quality gate on it (#487), so the same
      # question is asked here, where it costs a minute instead of a round trip.
      - name: No pull request pushes a literal past S1192's threshold
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          python tools/check_repeated_literals.py --base "${{ github.event.pull_request.base.sha }}"
      # The .globalconfig mirrors a profile that lives on a server, so it can go stale
      # without anything in this repository changing. One call to sonarcloud.io per run
      # buys learning about that on the pull request that first meets it. A profile that
      # moved exits 1 and prints the diff; an API that cannot be reached exits 2 and says
      # so, because a check that goes green on silence proves nothing.
      - name: Sonar globalconfig is current
        run: |
          mkdir -p obj
          dotnet build src/Lodestar.Fuzzy -c Release --no-incremental -f net10.0 \
            -p:ErrorLog=$GITHUB_WORKSPACE/obj/sonar-rules.sarif%2Cversion=2
          python tools/generate_sonar_globalconfig.py --check

  changes:
    name: Changed files
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/docs_only.py
          sparse-checkout-cone-mode: false

      # A pull request that changes only Markdown takes a reduced path (#857). The files come
      # from the API, so no history is fetched; a push to main is never docs-only.
      - name: Classify the pull request
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          answer=$(gh api "repos/${{ github.repository }}/pulls/$PR/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' | python3 tools/docs_only.py)
          echo "docs_only=$answer" >> "$GITHUB_OUTPUT"
          echo "docs-only: $answer"

  build-test:
    name: Build, test, pack
    runs-on: ubuntu-latest
    needs: changes
    # One Linux build serves the tests, the packages and the SonarQube Cloud analysis (#857):
    # the scanner must watch the compilation, so the analysis cannot reuse another job's build.
    # !cancelled() keeps this required check from being skipped when `changes` fails; an empty
    # docs_only output then takes the full path.
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    env:
      # SONAR_TOKEN reaches neither fork pull requests nor Dependabot: Dependabot runs read
      # from a separate secrets store, and its branches live in this repository, so a
      # fork-only guard lets them through to fail on an empty token. Those still build and
      # test here; only the analysis is left out.
      SONAR: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Set up JDK 17
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 17
          distribution: 'zulu'

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Shallow clones break blame, and with it new-code detection.
          fetch-depth: 0

      # The libraries target net10.0; the scanner analyses whatever the build
      # compiles, so the SDK has to be present before it runs.
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache SonarQube Cloud packages
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true'
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true' && steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/scanner"
          dotnet tool update dotnet-sonarscanner --tool-path "${{ runner.temp }}/scanner"

      # begin -> build -> end: the scanner installs the Roslyn analyzers and
      # observes the compilation, so the build must happen between the two and
      # must not be skipped or served from cache — an incremental no-op build
      # produces an empty analysis that still reports success.
      #
      # *Every* compilation in the window is observed, not just the first, which
      # is what lets the samples be analysed without joining Lodestar.slnx. They
      # must stay out of it: inside the solution they would resolve Lodestar by
      # ProjectReference, and the packaging gate and the snippet check would both
      # become assertions about a graph that never ships (ADR 0009). Analysis
      # follows the build list, so before this they were read by nothing —
      # PackagingGate.cs landed with 0 issues reported, not because it is clean
      # but because no analyser had opened it.
      #
      # The scanner is no longer the only thing that reads them: since ADR 0019,
      # samples/Directory.Build.props carries SonarAnalyzer.CSharp and the samples
      # inherit the repository-wide .NET code-quality settings, so the samples
      # build below fails on a finding on its own. This window is still what puts
      # those findings in front of the quality gate.
      #
      # tools/ is excluded from *coverage* only, not from analysis: those scripts
      # are Python development utilities that generate data for the suite, so no
      # C# test will ever execute a line of them. Left in, they enter the quality
      # gate as new uncovered code and fail it on the day one of them is edited.
      # samples/ joins them for the same reason and a stronger one: the samples
      # have no tests and never will, because they *are* the test — the sample is
      # what proves the packages resolve, and the snippets are what proves the
      # guides compile. Analysed, never covered.
      #
      # samples/Lodestar.DocSnippets/Generated/ is excluded from *analysis*: it is
      # extracted verbatim from the Markdown by tools/extract_doc_snippets.py, so
      # a finding there is a finding about prose the guides deliberately keep
      # short, and the file to fix it in would be a guide — where the rule usually
      # does not apply. The path is spelled out rather than written **/Generated/**
      # so that a generated directory added anywhere else has to opt out on
      # purpose instead of inheriting silence. The hand-written SnippetContext.cs
      # stays in.
      #
      # tests/oracles/ is excluded from *analysis*, which is the stronger form.
      # Two of the fixtures are binary — tiny_sp.model is a protobuf, first
      # undecodable byte at offset 54; tiny_encoder.onnx is an ONNX graph, offset
      # 3 — and the scanner indexes every unexcluded file and decodes it with
      # sonar.sourceEncoding, so each run logged "Invalid character encountered
      # ... for encoding UTF-8". Declaring an encoding is not the fix the warning
      # suggests it is: no encoding makes a protobuf text. The rest of the
      # directory is ~4.5 MB of generated JSON corpora, which are frozen
      # reference data rather than something to analyse.
      #
      # .claude/skills/ is vendored third-party code — obra/superpowers, MIT, at a
      # pinned commit — and it is excluded on evidence rather than on principle.
      # Three runs on pull request 455 make a 2x2: the gate fails whenever this tree
      # is analysed and passes whenever it is excluded, independently of which files
      # it holds. The condition is not one better code would satisfy — the gate wants
      # coverage on new code, and a dependency's shell helpers cannot be unit-tested
      # into this project's coverage report.
      #
      # What this does not silence is the part that matters. SonarCloud also exports
      # to GitHub code scanning, and that channel is not governed by this property:
      # it raised three high-severity alerts on a 723-line HTTP server the vendored
      # tree carried, which is why that server is no longer in it
      # (.claude/skills/README.md). Security findings still arrive; the gate's
      # coverage condition, which vendored code can never meet, does not.
      #
      # Both exclusion properties are set because a file is indexed as either
      # main or test source, and these belong to no project's compilation — they
      # are copied to output as `None Include=...`, so which bucket the MSBuild
      # integration puts them in is not worth a CI round-trip to discover.
      # Neither bucket has anything here to analyse.
      #
      # cpd.exclusions covers the stemmers, and only them: CPD normalises every
      # literal to one token before it compares, so two suffix tables of similar
      # length are identical to it however different the suffixes are. Measured on
      # #574 — the 105-token run it reported over Danish and Swedish is
      # `$LIT or $LIT ... ; private static readonly string[] Step1Suffixes = [ $LIT,
      # ... ]`, which is the s-ending predicate and the step 1 table, i.e. the two
      # places those two languages differ most. A single ~35-entry table is already
      # ~77 tokens, so no ordering of the members keeps two of them under the
      # 100-token minimum; the duplication the shared shape really did carry was
      # factored into ScandinavianSnowballWorker instead, which took the density
      # from 11.0% to 7.7% before this. Decision 0088 has the measurement and the
      # scope. Every other duplication finding in the repository still fails the
      # gate — this is the one directory whose files are transcribed tables.
      #
      # projectBaseDir is pinned because those two exclusions are *relative*: they
      # are matched against whatever directory the scanner decided was the base,
      # and Scanner for .NET warns that its auto-detection of that directory
      # already changed once between major versions. Left implicit, an upgrade
      # that moved the base would make the patterns match nothing and the
      # exclusions would fail open — silently, because the only symptom is a WARN,
      # and a WARN never fails a job. $GITHUB_WORKSPACE is the value auto-detection
      # resolves to today, so pinning it changes no file key and re-keys no issue.
      #
      # qualitygate.wait is what makes this job's colour mean something. Without
      # it `end` uploads the analysis and exits 0 whatever the gate says, so a
      # pull request that fails the gate reported a green "Build and analyze" and
      # nothing stopped it — the analysis was published and then ignored. With it,
      # `end` polls until the gate is computed and exits non-zero when it fails,
      # which is what the branch ruleset on main requires to pass. The cost is
      # waiting for the server: the poll gives up after sonar.qualitygate.timeout,
      # 300 seconds by default, and a timeout also fails the job.
      #
      # The gate is Sonar's own "Clean as You Code" definition, on *new* code, so
      # what it blocks is what this pull request introduced — not the backlog it
      # inherited.
      #
      # tools/tests/** is excluded rather than declared. SonarPython reads a
      # Python file it cannot see as test code as production code and says so:
      # "detected files that look like test code but 'sonar.tests' is not
      # configured". The property it asks for cannot be set here — SonarScanner
      # for .NET 9 and later derives sonar.sources and sonar.tests from the
      # MSBuild projects it wraps and ignores both if you pass them, and this
      # job installs the scanner with `dotnet tool update`, unpinned. So the
      # choice is between a permanent warning and not analysing the file. What
      # is lost is small and named: tools/tests holds one file, whose own
      # correctness is proven by running it in the Lint job, not by reading it.
      #
      # assets/** is the same "Invalid character ... UTF-8" warning as
      # tests/oracles/'s binary fixtures above, on assets/icon.png: a PNG has
      # nothing for a text-encoding sensor to read.
      # `tests/**` joined the coverage exclusions with #623, and it changes no number today:
      # the Microsoft.Testing.Platform collector reports the modules a run loaded and attributes
      # them to src/ alone, so no test file appears in a report any more. It is declared anyway,
      # because the exclusion should be a decision rather than a property of whichever collector
      # is installed. coverlet did report test sources, and that is most of why `lines_to_cover`
      # falls from 14 533 to 12 539 between the two: 1 994 of those lines were tests measuring
      # themselves. The 95.4% that replaces 92.6% is production code only.
      - name: Begin analysis
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" begin \
            /k:"CyrilB1531_data.net" \
            /o:"cyrilb1531" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.vscoveragexml.reportsPaths="**/TestResults/*.xml" \
            /d:sonar.python.version="3.12" \
            /d:sonar.projectBaseDir="$GITHUB_WORKSPACE" \
            /d:sonar.coverage.exclusions="tools/**,bench/**,samples/**,tests/**,.claude/**" \
            /d:sonar.exclusions="tests/oracles/**,samples/Lodestar.DocSnippets/Generated/**,tools/tests/**,assets/**,.claude/**" \
            /d:sonar.test.exclusions="tests/oracles/**" \
            /d:sonar.cpd.exclusions="src/Lodestar.Text/Stemming/**"

      - name: Build the solution
        run: dotnet build Lodestar.slnx --configuration Release

      # A pull request that changes only Markdown still runs the documentation tests: 21
      # ReferenceDocumentationTests classes read docs/**/*.md, and one caught #859's missing
      # link before it was pushed. Everything else in this job cannot see a .md change.
      - name: Test the documentation only
        if: needs.changes.outputs.docs_only == 'true'
        run: dotnet test Lodestar.slnx --configuration Release --no-build --filter "FullyQualifiedName~.Documentation."

      # Everything after `--` goes to Microsoft.Testing.Platform, which xunit v3 runs on
      # instead of VSTest (#623). `--collect` and `--logger` were VSTest's, and the data
      # collector behind the first was coverlet, which collects nothing here now.
      #
      # Both reports are deliberately left to their generated names. These options take a
      # path, not a pattern, so one name makes all 32 processes write to the same file and
      # the last writer wins. Measured, twice: a pinned `--coverage-output` reported ONE
      # module instead of sixteen, and a pinned `--report-trx-filename` reported 777 tests
      # instead of 6904 -- both green, both nearly empty, which is the failure this
      # repository has been bitten by before.
      - name: Test (with coverage)
        if: needs.changes.outputs.docs_only != 'true'
        run: >
          dotnet test Lodestar.slnx --configuration Release --no-build
          --
          --coverage --coverage-output-format xml
          --report-trx

      # No -p:Version: each project declares its own in a sibling Version.props,
      # and that declaration is authoritative everywhere — here and at release.
      - name: Pack
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          for proj in src/Lodestar.Abstractions src/Lodestar.Text src/Lodestar.Embeddings src/Lodestar.Fuzzy src/Lodestar.Metrics src/Lodestar.Conformal src/Lodestar.Decomposition src/Lodestar.Onnx src/Lodestar.Extensions.AI src/Lodestar.Extensions.MathNet src/Lodestar.Extensions.VectorData src/Lodestar.Cluster src/Lodestar.Preprocessing src/Lodestar.Stats src/Lodestar.Stats.Regression src/Lodestar.Stats.TimeSeries src/Lodestar.Survival src/Lodestar.Gpu; do
            dotnet pack "$proj" --configuration Release --no-build --output ./artifacts
          done

      - name: Extract the guide snippets
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 tools/extract_doc_snippets.py

      # The samples restore Lodestar from ./artifacts, and the builds above have
      # already pulled published Lodestar packages into the default global folder
      # (src/ reaches Lodestar.Text by PackageReference). The global folder is
      # consulted ahead of every source, so a published package sitting in it
      # wins whenever the two share a version — these two builds would then
      # analyse a consumer of what already shipped. Their own NUGET_PACKAGES is
      # what keeps them identical to the gates in ci.yml, which is the point:
      # analysing a build that diverges from the one being gated is worse than
      # not analysing at all. See docs/decisions/0009-sample-consumes-a-local-feed.md.
      - name: Build the samples
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/sample-packages
        run: |
          dotnet build samples/Lodestar.Sample --configuration Release
          dotnet build samples/Lodestar.DocSnippets --configuration Release

      # Coverage must be written before `end` collects it, and a format or path mismatch
      # fails silently as 0% coverage -- which is why the format is named on both sides
      # and neither side is a default.
      #
      # Visual Studio coverage XML, not OpenCover: xunit v3 runs on Microsoft.Testing
      # .Platform, whose coverage extension emits `xml`, `coverage` and `cobertura` and
      # no OpenCover at all (#623). `xml` is the one SonarQube Cloud's .NET path reads,
      # through sonar.cs.vscoveragexml.reportsPaths above.
      #
      # One file per test assembly, under each project's TestResults/. Pinning a single
      # name collapses them onto each other -- see ci.yml, where that was measured.
      - name: End analysis
        if: env.SONAR == 'true' && needs.changes.outputs.docs_only != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          "${{ runner.temp }}/scanner/dotnet-sonarscanner" end /d:sonar.token="$SONAR_TOKEN"

      # The libraries reference each other by package, never by project. The
      # opt-in developer loop (LodestarUseProjectRefs) puts a ProjectReference
      # back, so a text grep cannot tell the shipped path from the local one —
      # it would match the conditional ItemGroup either way. Evaluated MSBuild
      # can, and this job never sets the property.
      - name: src/ ships PackageReference only
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          for proj in src/Lodestar.Abstractions src/Lodestar.Text src/Lodestar.Embeddings src/Lodestar.Fuzzy src/Lodestar.Metrics src/Lodestar.Conformal src/Lodestar.Decomposition src/Lodestar.Onnx src/Lodestar.Extensions.AI src/Lodestar.Extensions.MathNet src/Lodestar.Extensions.VectorData src/Lodestar.Cluster src/Lodestar.Preprocessing src/Lodestar.Stats src/Lodestar.Stats.Regression src/Lodestar.Stats.TimeSeries src/Lodestar.Survival src/Lodestar.Gpu; do
            refs=$(dotnet msbuild "$proj" -getItem:ProjectReference -p:TargetFramework=net10.0 \
              | python3 -c 'import sys, json; print(" ".join(i["Identity"] for i in json.load(sys.stdin)["Items"]["ProjectReference"]))')
            # One temporary exception, explained in src/Lodestar.Stats.TimeSeries's .csproj: this line
            # goes when that ProjectReference becomes a PackageReference.
            [ "$proj" = src/Lodestar.Stats.TimeSeries ] && refs=${refs//..\/Lodestar.Stats.Regression\/Lodestar.Stats.Regression.csproj/}
            refs=$(echo $refs)
            if [ -n "$refs" ]; then
              echo "::error::$proj references $refs by project; src/ must reference published packages."
              exit 1
            fi
          done

      # Three files hold a Lodestar.Text version number for three different
      # reasons, and MSBuild is happy when they disagree. --check-feed also
      # proves the floor is resolvable, which is what lets a clean clone build
      # with no pack step — a broken floor otherwise surfaces only on a machine
      # whose NuGet cache is cold, never on the one that raised it.
      - name: The Lodestar.Text floor is coherent
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 tools/check_version_floor.py --check-feed

      # The sample is the only thing a contributor reads to see a package work, and
      # it printed 0,807 on a French console against CI's 0.807 for two releases
      # (#205). CA1305 never fires on an interpolated hole, at any AnalysisMode.
      - name: The sample prints no number in the contributor's culture
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 tools/check_sample_culture.py

      - name: The shipped dependency graph is the intended one
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 tools/check_nuspec_dependencies.py ./artifacts --require-all

      - name: Upload test results
        if: always() && needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: '**/*.trx'

      - name: Upload NuGet package
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget
          path: ./artifacts/*.nupkg

  # The ruleset on main requires a check named "Build and analyze", which the SonarQube Cloud
  # workflow posted until its build merged into build-test (#857). This keeps the name and its
  # meaning: it passes only when the job that ran the analysis passed.
  analysis-gate:
    name: Build and analyze
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    steps:
      - name: The build, the tests and the analysis passed
        run: |
          if [ "${{ needs.build-test.result }}" != "success" ]; then
            echo "::error::Build, test, pack ended ${{ needs.build-test.result }}."
            exit 1
          fi

  sample:
    name: Sample consumes the packages
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # The sample restores from ./artifacts, so the packages must exist before
      # it: this gate tests what is about to ship, not what already shipped.
      #
      # Packing Lodestar.Fuzzy restores Lodestar.Text from nuget.org, because src/
      # reaches it by PackageReference and has no local feed. That extraction
      # must not be visible to the sample: the global packages folder is
      # consulted ahead of every source, so a published package sitting in it
      # wins over the one just built whenever the two share a version, and the
      # gate silently validates the wrong assembly. Separate folders make the
      # two restores independent; samples/NuGet.config maps Lodestar.* to the
      # local feed so the sample's restore can only succeed from ./artifacts.
      - name: Pack
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/pack-packages
        run: |
          for proj in src/Lodestar.Abstractions src/Lodestar.Text src/Lodestar.Embeddings src/Lodestar.Fuzzy src/Lodestar.Metrics src/Lodestar.Conformal src/Lodestar.Decomposition src/Lodestar.Onnx src/Lodestar.Extensions.AI src/Lodestar.Extensions.MathNet src/Lodestar.Extensions.VectorData src/Lodestar.Cluster src/Lodestar.Preprocessing src/Lodestar.Stats src/Lodestar.Stats.Regression src/Lodestar.Stats.TimeSeries src/Lodestar.Survival src/Lodestar.Gpu; do
            dotnet pack "$proj" --configuration Release -o ./artifacts
          done

      # Building here means resolving the packages as a consumer would, so a
      # missing dependency group or an unreachable public type fails the build.
      # Running it means the code actually works once resolved.
      - name: Run the sample
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/sample-packages
        run: dotnet run --project samples/Lodestar.Sample --configuration Release

  docs-snippets:
    name: Guide snippets compile, reference snippets run
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # markdownlint validates the Markdown and does not know C# exists, so
      # until now a renamed method could not fail anything the guides are in.
      # The snippets are compiled from the Markdown itself — there is no second
      # copy to keep in sync, so they cannot drift.
      #
      # Against the packed packages, not the projects: a snippet that only
      # compiles through a ProjectReference is not one a reader can run. Same
      # NUGET_PACKAGES separation as the sample job, and for the same reason —
      # see docs/decisions/0009-sample-consumes-a-local-feed.md.
      - name: Pack
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/pack-packages
        run: |
          for proj in src/Lodestar.Abstractions src/Lodestar.Text src/Lodestar.Embeddings src/Lodestar.Fuzzy src/Lodestar.Metrics src/Lodestar.Conformal src/Lodestar.Decomposition src/Lodestar.Onnx src/Lodestar.Extensions.AI src/Lodestar.Extensions.MathNet src/Lodestar.Extensions.VectorData src/Lodestar.Cluster src/Lodestar.Preprocessing src/Lodestar.Stats src/Lodestar.Stats.Regression src/Lodestar.Stats.TimeSeries src/Lodestar.Survival src/Lodestar.Gpu; do
            dotnet pack "$proj" --configuration Release -o ./artifacts
          done

      - name: Extract the snippets from the guides
        run: python3 tools/extract_doc_snippets.py

      - name: Build them
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/snippet-packages
        run: dotnet build samples/Lodestar.DocSnippets --configuration Release

      # Compiling caught an API that moved; running catches a documented result
      # that is wrong. Only docs/reference/** fences run — see Program.cs.
      - name: Run them
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/snippet-packages
        run: dotnet run --project samples/Lodestar.DocSnippets --configuration Release

  stopwords-pinned:
    name: Stop-word lists match their pinned source
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The five Snowball lists are redistributed inside the assembly, so their
      # provenance is a shipping guarantee, not a test fixture. The script checks
      # each download against a pinned SHA-256 and regenerates the C#: a failure
      # here means upstream edited a list, and that is a decision to record — see
      # docs/decisions/0010-stop-word-list-provenance.md. No dependency to install.
      - name: Verify the vendored stop-word lists
        run: python tools/fetch_stopwords.py --check

      - name: Verify the vendored GPT-2 vocabulary
        run: python tools/fetch_gpt2_bpe.py --check

  oracles-fresh:
    name: Oracles are reproducible
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Regenerate the oracles and compare them numerically
        run: |
          # Install from the generated lock, not the human-edited input:
          #   --require-hashes    every artefact must match a recorded hash, which
          #                       also pins the transitive graph (nltk pulls regex,
          #                       scikit-learn pulls scipy, and so on)
          #   --only-binary :all: no source distribution, so no setup.py executes
          pip install --only-binary :all: --require-hashes -r tools/requirements.lock.txt
          # keybert (the MMR oracle's reference) is not in the lock: its own
          # install_requires drags in sentence-transformers and, through it, torch
          # and transformers, none of which keybert._mmr.mmr needs. --no-deps
          # keeps the lock's resolved graph untouched; see tools/requirements-nodeps.txt.
          # --only-binary :all: as on the lock install above: keybert 0.9.0 also
          # publishes an sdist, and the pinned hash is the wheel's alone.
          #
          # summa (the TextRank oracle's reference) is the one entry in
          # that file --only-binary :all: cannot satisfy at all: it ships no wheel,
          # only an sdist, so `pip install --only-binary :all: summa==1.2.0` finds no
          # candidate on every one of this repository's five install sites. Here,
          # and only here, `--no-binary summa` overrides that flag for this one
          # package -- pip resolves per-package binary/source constraints, and the
          # more specific one wins -- so its setup.py runs, hash-checked against the
          # pinned sdist, and no other install site is affected because none of them
          # read this file.
          pip install --no-deps --only-binary :all: --no-binary summa --require-hashes -r tools/requirements-nodeps.txt
          # The generator writes over tests/oracles in place, so the committed
          # corpora are copied aside first — there is nothing to compare against
          # afterwards otherwise.
          cp -R tests/oracles "${{ runner.temp }}/oracles-committed"
          python tools/generate_oracles.py
          # Numerically, at the 1e-9 the suites replay these corpora at, rather
          # than byte for byte: the last digits of a value a BLAS kernel reduced
          # describe the CPU the job landed on, not the quantity (decision 0073).
          if ! python tools/compare_oracles.py "${{ runner.temp }}/oracles-committed" tests/oracles; then
            echo "::error::A regenerated corpus differs from the committed one by more than the 1e-9 the test suites compare at. Run tools/generate_oracles.py and commit the result."
            exit 1
          fi

      # The runner is thrown away with everything that would let the failure be
      # reproduced: a difference this gate reports survived a 1e-9 comparison and
      # is a real change to a corpus, which the log's capped excerpt names but
      # does not explain. Keeping the freshly generated corpora makes the whole
      # comparison possible off the runner.
      - name: Keep the generated corpora when they differed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracles-as-regenerated
          path: tests/oracles/
          retention-days: 14

  windows:
    name: Build, test and platform checks (Windows)
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft == false && needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Markdownlint, the oracle drift gate and the SonarCloud gate stay
      # Linux-only above: none of the three depends on which platform runs it,
      # so duplicating them here would buy nothing but wall-clock on every pull
      # request. This job carries what does depend on the platform: the build,
      # the eight test assemblies across both target frameworks, and the three
      # checks whose failure mode is platform-specific -- a machine path
      # slipping into a tracked file, the Lodestar.Text version floor, and the
      # tool tests that exercise the guard and generator scripts themselves.
      # Measured on windows-latest at 39.7 s (build) and 24.3 s (test) -- issue
      # #138's probe, run 31728500235 -- against several minutes for
      # "Build, test, pack" on Linux, so this job will not become the slowest
      # check on a pull request even running in parallel with the others.
      - name: Build
        run: dotnet build Lodestar.slnx -c Release

      - name: Test
        run: dotnet test Lodestar.slnx -c Release

      # Same lock file, same flags, installed into the runner's own Python --
      # no venv, matching the Linux jobs. This is the first job to install it
      # on Windows at all: the lock would not install here until issue #138
      # (task 1b) pinned colorama unconditionally, and nothing had re-run it
      # on this platform since. `python` is deliberate, not `python3` (absent
      # on a python.org install) or `py` (resolves a different interpreter
      # than the one setup-python just put on PATH).
      - name: Install tool dependencies
        run: |
          pip install --only-binary :all: --require-hashes -r tools/requirements.lock.txt

      - name: Tool tests
        run: python -m pytest tools/tests -q

      - name: No machine paths in tracked files
        run: python tools/check_machine_paths.py

      - name: Comment budgets
        run: python tools/check_comment_length.py

      - name: The sample prints no number in the contributor's culture
        run: python tools/check_sample_culture.py

      - name: The Lodestar.Text floor is coherent
        run: python tools/check_version_floor.py
